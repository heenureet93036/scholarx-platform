spring:
  application:
    name: ai-review-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/scholardb
    username: ${DB_USER:scholar}
    password: ${DB_PASS:scholar123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ai-review-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8082

hyperspace:
  base-url: ${HYPERSPACE_URL:http://localhost:6655/litellm/v1}
  api-key: ${HYPERSPACE_API_KEY:}
  model: ${HYPERSPACE_MODEL:claude-sonnet-4-6}

ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  model: llama3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
