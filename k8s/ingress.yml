apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scholarx-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: scholarx.local
      http:
        paths:
          - path: /api/scholars
            pathType: Prefix
            backend:
              service:
                name: scholar-service
                port:
                  number: 8081
          - path: /api/gap
            pathType: Prefix
            backend:
              service:
                name: gap-service
                port:
                  number: 8083
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8084
