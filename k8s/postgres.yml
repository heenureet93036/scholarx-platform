apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarx-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scholarx-postgres
  template:
    metadata:
      labels:
        app: scholarx-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: scholardb
            - name: POSTGRES_USER
              value: scholar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scholarx-secret
                  key: DB_PASS
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scholar", "-d", "scholardb"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scholarx-postgres
  namespace: default
spec:
  selector:
    app: scholarx-postgres
  ports:
    - port: 5432
      targetPort: 5432
