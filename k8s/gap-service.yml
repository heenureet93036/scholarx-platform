apiVersion: apps/v1
kind: Deployment
metadata:
  name: gap-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gap-service
  template:
    metadata:
      labels:
        app: gap-service
    spec:
      containers:
        - name: gap-service
          image: scholarx/gap-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: scholarx-config
            - secretRef:
                name: scholarx-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gap-service
  namespace: default
spec:
  selector:
    app: gap-service
  ports:
    - port: 8083
      targetPort: 8083
