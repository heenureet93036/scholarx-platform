apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarx-zookeeper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scholarx-zookeeper
  template:
    metadata:
      labels:
        app: scholarx-zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
          ports:
            - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: scholarx-zookeeper
  namespace: default
spec:
  selector:
    app: scholarx-zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarx-kafka
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scholarx-kafka
  template:
    metadata:
      labels:
        app: scholarx-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: scholarx-zookeeper:2181
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://scholarx-kafka:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 9092
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: scholarx-kafka
  namespace: default
spec:
  selector:
    app: scholarx-kafka
  ports:
    - port: 9092
      targetPort: 9092
