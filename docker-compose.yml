version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: scholarx-postgres
    environment:
      POSTGRES_DB: scholardb
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scholarx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholardb"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: scholarx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - scholarx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: scholarx-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - scholarx-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: scholarx-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - scholarx-network

  scholar-service:
    build: ./scholar-service
    container_name: scholar-service
    image: scholarx/scholar-service:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: scholar
      DB_PASS: scholar123
      KAFKA_BROKER: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - scholarx-network

  ai-review-service:
    build: ./ai-review-service
    container_name: ai-review-service
    image: scholarx/ai-review-service:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: scholar
      DB_PASS: scholar123
      KAFKA_BROKER: kafka:9092
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8082:8082"
    networks:
      - scholarx-network

  gap-service:
    build: ./gap-service
    container_name: gap-service
    image: scholarx/gap-service:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: scholar
      DB_PASS: scholar123
      KAFKA_BROKER: kafka:9092
    ports:
      - "8083:8083"
    networks:
      - scholarx-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    image: scholarx/notification-service:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: scholar
      DB_PASS: scholar123
      KAFKA_BROKER: kafka:9092
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    ports:
      - "8084:8084"
    networks:
      - scholarx-network

networks:
  scholarx-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
